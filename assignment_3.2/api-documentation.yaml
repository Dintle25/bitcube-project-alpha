openapi: 3.0.4

info:
  title: Conference Room Booking System API
  version: 1.0.0
  description: |
    REST API for managing conference room bookings in an office environment.
    Allows employees to book rooms, check availability, manage bookings, 
    and supports admin and facilities management features.
  contact:
    name: Conference Room Booking Team
    email: devteam@company.com
    url: https://conference-room-booking-system

servers:
  - url: https://api.conferenceroom.company.com/v1
    description: Production Server
  - url: https://staging-api.conferenceroom.company.com/v1
    description: Staging Server (for testing)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained after login

  schemas:
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: "Boardroom A"
        capacity:
          type: integer
          example: 12
        floor:
          type: string
          example: "5th Floor"
        equipment:
          type: array
          items:
            type: string
          example: ["Projector", "Whiteboard", "Video Conference"]
        isAvailable:
          type: boolean

    Booking:
      type: object
      properties:
        id:
          type: integer
          example: 452
        roomId:
          type: integer
          example: 101
        userId:
          type: integer
          example: 34
        startTime:
          type: string
          format: date-time
          example: "2026-05-20T10:00:00+02:00"
        endTime:
          type: string
          format: date-time
          example: "2026-05-20T11:00:00+02:00"
        title:
          type: string
          example: "Sprint Planning Meeting"
        status:
          type: string
          enum: [confirmed, cancelled, completed]

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Room already booked"
        message:
          type: string
          example: "The selected time slot is no longer available"
        code:
          type: integer
          example: 409

security:
  - bearerAuth: []

paths:
  /rooms:
    get:
      summary: List all rooms
      tags: [Rooms]
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'

  /rooms/available:
    get:
      summary: Find available rooms
      tags: [Rooms]
      parameters:
        - name: startTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: capacity
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of available rooms

  /rooms/{roomId}:
    get:
      summary: Get room details
      tags: [Rooms]
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'

  /bookings:
    post:
      summary: Create a new booking
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: integer
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                title:
                  type: string
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          description: Conflict - Room already booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Get my bookings
      tags: [Bookings]
      responses:
        '200':
          description: List of user's bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /bookings/{bookingId}:
    get:
      summary: Get booking by ID
      tags: [Bookings]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking details

    delete:
      summary: Cancel a booking
      tags: [Bookings]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking cancelled successfully
        '403':
          description: Not authorized to cancel this booking

  /rooms/{roomId}/availability:
    get:
      summary: Check room availability for a time range
      tags: [Availability]
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
        - name: startTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Availability status
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  conflicts:
                    type: array
                    items:
                      type: object